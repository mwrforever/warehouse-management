# 进销存+生产管理系统：MySQL 开发环境（docker compose）
# 提供 MySQL 8.4 服务，数据库 php_design（用户 php / 密码 secret），供 Laravel 后端连接使用
services:
  mysql:
    image: mysql:8.4
    container_name: php-design-mysql
    environment:
      # root 超级用户口令（仅本地开发容器；生产数据库需另行加固）
      MYSQL_ROOT_PASSWORD: root
      # 自动创建的数据库名（与 server/.env 的 DB_DATABASE 对应）
      MYSQL_DATABASE: php_design
      # 业务账号/口令（与 server/.env 的 DB_USERNAME/DB_PASSWORD 对应）
      MYSQL_USER: php
      MYSQL_PASSWORD: secret
      # 容器时区（与业务时区约定对齐）
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
volumes:
  mysql_data:
